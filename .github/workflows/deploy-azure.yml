# main e push korle Azure Web App e deploy hoy (API + App ek sathe).
# Setup: DEPLOY.md dekhun. Secret / variable na thakle shudhu build hoy, deploy skip hoy.
name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      HAS_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish (API + App)
        run: dotnet publish Api/ProductShop.Api/ProductShop.Api.csproj -c Release -o ${{ runner.temp }}/app

      - name: Deploy to Azure Web App
        if: env.HAS_PROFILE == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ runner.temp }}/app

      - name: Deploy skipped
        if: env.HAS_PROFILE != 'true'
        run: echo "AZURE_WEBAPP_PUBLISH_PROFILE secret nai, tai deploy skip kora holo. DEPLOY.md dekhun."
